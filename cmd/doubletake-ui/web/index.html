<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Doubletake</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='none' stroke='%237fd4a0' stroke-width='2' d='M3 5h18v11H3zM8 20h8M12 16v4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main class="card">
      <header class="head">
        <h1>Doubletake</h1>
        <span id="state" class="badge">…</span>
      </header>

      <div class="sources" role="radiogroup" aria-label="What to share">
        <button type="button" class="source" data-source="monitor" role="radio">Screen</button>
        <button type="button" class="source" data-source="window" role="radio">Window</button>
        <button type="button" class="source" data-source="any" role="radio">Ask</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite">—</p>

      <ul id="devices" class="devices" aria-label="Receivers"></ul>

      <form id="pin-form" class="pin hidden">
        <input id="pin-input" type="text" inputmode="numeric" autocomplete="off" aria-label="PIN shown on the receiver" placeholder="PIN" />
        <button type="submit" class="btn btn-primary">Send</button>
      </form>

      <footer class="actions">
        <button type="button" id="refresh" class="btn">Refresh</button>
        <button type="button" id="stop" class="btn">Stop casting</button>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
